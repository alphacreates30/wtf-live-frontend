<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>What The Find — collections, consigned and sold at auction</title>
    <meta name="description" content="Online auctions of collections and consigned items. Every lot photographed, catalogued and described. Every collection has a story worth telling." />

    <!-- The default share card (C3). Lot and auction pages get their own for link crawlers (api/share-meta.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="What The Find" />
    <meta property="og:title" content="What The Find" />
    <meta property="og:description" content="Online auctions of collections and consigned items. Every collection has a story." />
    <meta property="og:url" content="https://whatthefind.live/" />
    <meta property="og:image" content="https://whatthefind.live/og/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="What The Find: every collection has a story." />
    <meta property="og:image" content="https://whatthefind.live/og/og-default-square.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="What The Find: every collection has a story." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="What The Find" />
    <meta name="twitter:description" content="Online auctions of collections and consigned items. Every collection has a story." />
    <meta name="twitter:image" content="https://whatthefind.live/og/og-default.png" />
    <meta name="twitter:image:alt" content="What The Find: every collection has a story." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- iOS ignores SVG here ("Add to Home Screen" showed a blank screenshot tile): PNG only. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FBFAF7" />

    <!-- Lot photos (Supabase storage): the homepage hero image is the largest paint. -->
    <link rel="preconnect" href="https://rlzoerwkwdpasnxiwflz.supabase.co" />
    <!-- The API: the homepage and a lot page request their data before React renders (main.jsx). -->
    <link rel="preconnect" href="https://wtf-live-backend-production.up.railway.app" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
